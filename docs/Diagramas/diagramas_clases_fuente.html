<style>
  html,body{margin:0;background:#fff}
  svg{display:block}
  .name{font:700 13px "Segoe UI",Arial,sans-serif}
  .stereo{font:italic 11px "Segoe UI",Arial,sans-serif}
  .mem{font:11.5px Consolas,"Courier New",monospace;fill:#1f2328}
  .lbl{font:11.5px "Segoe UI",Arial,sans-serif;fill:#333}
  .mult{font:11px "Segoe UI",Arial,sans-serif;fill:#333}
  .title{font:700 15px "Segoe UI",Arial,sans-serif;fill:#333}
  .pkg{font:700 12px "Segoe UI",Arial,sans-serif;fill:#555}

<body><svg id="s" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const PAL = {
  dom:  {head:'#a8e4f5', border:'#2b9cc0'},
  srv:  {head:'#ffbf8a', border:'#df8a3e'},
  cli:  {head:'#c3e58f', border:'#6aa632'},
  com:  {head:'#b8ecd0', border:'#3aa56b'},
  ext:  {head:'#dcdcd6', border:'#8a8a84'}
};
const LH = 15;
function boxH(b){
  let h = (b.stereo?14:0) + 24;
  if (b.attrs) h += 8 + b.attrs.length*LH;
  if (b.methods) h += 8 + b.methods.length*LH;
  return h + 4;
}
function side(b, s, off){
  off = off==null ? .5 : off;
  if (s==='l') return [b.x, b.y + b.h*off];
  if (s==='r') return [b.x+b.w, b.y + b.h*off];
  if (s==='t') return [b.x + b.w*off, b.y];
  return [b.x + b.w*off, b.y + b.h];
}
function render(d){
  const svg = document.getElementById('s');
  svg.setAttribute('width', d.W); svg.setAttribute('height', d.H);
  svg.setAttribute('viewBox', `0 0 ${d.W} ${d.H}`);
  let out = `<defs>
   <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#fff" stroke="#444" stroke-width="1.2"/></marker>
   <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#444" stroke-width="1.4"/></marker>
  </defs>`;
  out += `<rect x="0" y="0" width="${d.W}" height="${d.H}" fill="#fff"/>`;
  if (d.title) out += `<text class="title" x="16" y="24">${d.title}</text>`;
  const B = {};
  for (const b of d.boxes){ b.h = boxH(b); B[b.id] = b; }
  for (const p of (d.pkgs||[])){
    out += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6" fill="#fafaf7" stroke="#b9b9b2" stroke-dasharray="5 4"/>`;
    out += `<text class="pkg" x="${p.x+10}" y="${p.y+17}">${p.name}</text>`;
  }
  // edges first (under boxes)
  for (const e of d.edges){
    const a = B[e.from], b = B[e.to];
    let p1 = side(a, e.fs, e.fo), p2 = side(b, e.ts, e.to2);
    let pts = [p1];
    const r = e.route || 'h';
    if (r==='h'){ const mx = e.mx!=null?e.mx:(p1[0]+p2[0])/2; pts.push([mx,p1[1]],[mx,p2[1]]); }
    else if (r==='v'){ const my = e.my!=null?e.my:(p1[1]+p2[1])/2; pts.push([p1[0],my],[p2[0],my]); }
    else if (r==='hv'){ pts.push([p2[0],p1[1]]); }
    else if (r==='vh'){ pts.push([p1[0],p2[1]]); }
    pts.push(p2);
    const dash = (e.type==='dep'||e.type==='real') ? 'stroke-dasharray="6 4"' : '';
    const mk = (e.type==='inh'||e.type==='real') ? 'marker-end="url(#tri)"' : (e.type==='dep'||e.type==='nav') ? 'marker-end="url(#open)"' : '';
    out += `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#444" stroke-width="1.3" ${dash} ${mk}/>`;
    if (e.label){
      // label on the longest segment
      let best=0, bi=0;
      if (e.lseg!=null){ bi=e.lseg; best=1; } else
      for (let i=0;i<pts.length-1;i++){ const L=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]); if(L>best){best=L;bi=i;} }
      const lx=(pts[bi][0]+pts[bi+1][0])/2 + (e.lx||0), ly=(pts[bi][1]+pts[bi+1][1])/2 + (e.ly||0);
      const tw = e.label.length*6.1+10;
      out += `<rect x="${lx-tw/2}" y="${ly-9}" width="${tw}" height="17" fill="#fff"/>`;
      out += `<text class="lbl" x="${lx}" y="${ly+4}" text-anchor="middle">${e.label}</text>`;
    }
    const mpos = (p, q, dx, dy) => [p[0] + (q[0]>p[0]?8:q[0]<p[0]?-8:0) + dx, p[1] + (q[1]>p[1]?14:q[1]<p[1]?-6:0) + dy];
    if (e.m1){ const [x,y]=mpos(p1,pts[1], e.m1dx||(pts[1][1]===p1[1]?0:8), e.m1dy||(pts[1][1]===p1[1]?-6:0)); out += `<text class="mult" x="${x}" y="${y}" text-anchor="${pts[1][0]<p1[0]?'end':'start'}">${e.m1}</text>`; }
    if (e.m2){ const q=pts[pts.length-2]; const [x,y]=mpos(p2,q, e.m2dx||(q[1]===p2[1]?0:8), e.m2dy||(q[1]===p2[1]?-6:0)); out += `<text class="mult" x="${x}" y="${y}" text-anchor="${q[0]<p2[0]?'end':'start'}">${e.m2}</text>`; }
  }
  for (const b of d.boxes){
    const c = PAL[b.pal||d.pal];
    let y = b.y;
    out += `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="5" fill="#fff" stroke="${c.border}" stroke-width="1.5"/>`;
    const hh = (b.stereo?14:0)+24;
    out += `<path d="M${b.x},${b.y+hh} V${b.y+5} a5,5 0 0 1 5,-5 H${b.x+b.w-5} a5,5 0 0 1 5,5 V${b.y+hh} Z" fill="${c.head}" stroke="${c.border}" stroke-width="1.5"/>`;
    if (b.stereo){ out += `<text class="stereo" x="${b.x+b.w/2}" y="${y+14}" text-anchor="middle">«${b.stereo}»</text>`; y+=14; }
    out += `<text class="name" x="${b.x+b.w/2}" y="${y+17}" text-anchor="middle" ${b.abstract?'font-style="italic"':''}>${b.name}</text>`;
    y = b.y + hh;
    for (const sec of [b.attrs, b.methods]){
      if (!sec) continue;
      out += `<line x1="${b.x}" y1="${y}" x2="${b.x+b.w}" y2="${y}" stroke="${c.border}" stroke-width="1"/>`;
      y += 6;
      for (const m of sec){
        const u = m.startsWith('_'); const t = u? m.slice(1): m;
        out += `<text class="mem" x="${b.x+8}" y="${y+11}" ${u?'text-decoration="underline"':''}>${t.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</text>`;
        y += LH;
      }
      y += 2;
    }
  }
  for (const n of (d.notes||[])){
    out += `<path d="M${n.x},${n.y} h${n.w-12} l12,12 v${n.h-12} h-${n.w} Z" fill="#fffbe6" stroke="#c9b458"/>`;
    n.lines.forEach((l,i)=> out += `<text class="lbl" x="${n.x+8}" y="${n.y+16+i*15}">${l}</text>`);
  }
  svg.innerHTML = out;
}
